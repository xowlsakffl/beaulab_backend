<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1500" width="1180" height="1500" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6C68"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B6E5A"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9C5410"/>
    </marker>
  </defs>

  <rect width="1180" height="1500" fill="#F1F5F3"/>

  <!-- ─── 머리글 ─── -->
  <text x="40" y="52" font-size="13" font-weight="600" fill="#0B6E5A" letter-spacing="1.6">HANDOVER</text>
  <text x="40" y="88" font-size="27" font-weight="700" fill="#13201D">병의원 챗봇 — 구조와 추가된 것</text>
  <text x="40" y="118" font-size="14.5" fill="#5B6C68">기존 레포에 무엇이 붙었고, 실시간을 어떻게 처리했고, 운영에 무엇이 더 필요한지.</text>

  <!-- ══════════ 1. 구성 ══════════ -->
  <text x="40" y="172" font-size="17" font-weight="700" fill="#13201D">1. 구성</text>
  <text x="40" y="196" font-size="13.5" fill="#5B6C68">새 서비스는 없습니다. 기존 Laravel 앱에 도메인 하나, 기존 Next 앱 두 곳에 화면이 붙었습니다.</text>

  <!-- 병의원 관리자 -->
  <rect x="40" y="218" width="300" height="152" rx="14" fill="#FFFFFF" stroke="#DBE4E1"/>
  <rect x="40" y="218" width="300" height="34" rx="14" fill="#E0F0EA"/>
  <rect x="40" y="240" width="300" height="12" fill="#E0F0EA"/>
  <text x="58" y="240" font-size="13" font-weight="700" fill="#0B6E5A">hospital-web (기존)</text>
  <text x="58" y="278" font-size="13.5" font-weight="600" fill="#13201D">챗봇 위젯 (SDK)</text>
  <text x="58" y="300" font-size="12.5" fill="#5B6C68">Shadow DOM · 외부 의존성 0</text>
  <text x="58" y="320" font-size="12.5" fill="#5B6C68">Host CSS와 섞이지 않음</text>
  <rect x="58" y="332" width="264" height="24" rx="6" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="68" y="348" font-size="11.5" fill="#5B6C68" font-family="ui-monospace, Menlo, monospace">packages/hospital-chatbot-sdk</text>

  <!-- 백엔드 -->
  <rect x="440" y="218" width="300" height="152" rx="14" fill="#FFFFFF" stroke="#BCCBC6" stroke-width="1.5"/>
  <rect x="440" y="218" width="300" height="34" rx="14" fill="#E0F0EA"/>
  <rect x="440" y="240" width="300" height="12" fill="#E0F0EA"/>
  <text x="458" y="240" font-size="13" font-weight="700" fill="#0B6E5A">Laravel (기존)</text>
  <text x="458" y="278" font-size="13.5" font-weight="600" fill="#13201D">HospitalChatBot 도메인</text>
  <text x="458" y="300" font-size="12.5" fill="#5B6C68">기존 Actions / Queries / DTO 구조 그대로</text>
  <text x="458" y="320" font-size="12.5" fill="#5B6C68">기존 Sanctum 쿠키 인증 그대로</text>
  <rect x="458" y="332" width="264" height="24" rx="6" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="468" y="348" font-size="11.5" fill="#5B6C68" font-family="ui-monospace, Menlo, monospace">app/Domains/HospitalChatBot</text>

  <!-- 상담원 -->
  <rect x="840" y="218" width="300" height="152" rx="14" fill="#FFFFFF" stroke="#DBE4E1"/>
  <rect x="840" y="218" width="300" height="34" rx="14" fill="#E0F0EA"/>
  <rect x="840" y="240" width="300" height="12" fill="#E0F0EA"/>
  <text x="858" y="240" font-size="13" font-weight="700" fill="#0B6E5A">staff-web (기존)</text>
  <text x="858" y="278" font-size="13.5" font-weight="600" fill="#13201D">상담 연결 · 기록 · Q&amp;A · 운영시간</text>
  <text x="858" y="300" font-size="12.5" fill="#5B6C68">기존 사이드바·권한 라우팅에 편입</text>
  <text x="858" y="320" font-size="12.5" fill="#5B6C68">새 권한 없음 (common.access)</text>
  <rect x="858" y="332" width="264" height="24" rx="6" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="868" y="348" font-size="11.5" fill="#5B6C68" font-family="ui-monospace, Menlo, monospace">/hospital-chatbot/*</text>

  <line x1="344" y1="294" x2="432" y2="294" stroke="#5B6C68" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="352" y="286" font-size="11.5" fill="#5B6C68">/api/v1/hospital</text>
  <line x1="744" y1="294" x2="832" y2="294" stroke="#5B6C68" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="756" y="286" font-size="11.5" fill="#5B6C68">/api/v1/staff</text>

  <!-- ══════════ 2. 테이블 ══════════ -->
  <text x="40" y="432" font-size="17" font-weight="700" fill="#13201D">2. 추가된 테이블 9개</text>
  <text x="40" y="456" font-size="13.5" fill="#5B6C68">전부 <tspan font-family="ui-monospace, Menlo, monospace" font-size="12.5">hospital_chatbot_</tspan> 접두사입니다. 기존 테이블은 하나도 바꾸지 않았습니다.</text>

  <!-- Q&A 그룹 -->
  <rect x="40" y="478" width="340" height="238" rx="14" fill="#FFFFFF" stroke="#DBE4E1"/>
  <text x="58" y="506" font-size="13" font-weight="700" fill="#13201D">Q&amp;A</text>

  <rect x="58" y="520" width="304" height="52" rx="9" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="70" y="540" font-size="12.5" font-weight="600" fill="#13201D" font-family="ui-monospace, Menlo, monospace">qna_folders</text>
  <text x="70" y="559" font-size="11.5" fill="#5B6C68">parent_id · depth(1~2) · sort_order</text>
  <text x="348" y="540" font-size="11" fill="#5B6C68" text-anchor="end">7행</text>

  <rect x="58" y="584" width="304" height="52" rx="9" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="70" y="604" font-size="12.5" font-weight="600" fill="#13201D" font-family="ui-monospace, Menlo, monospace">qnas</text>
  <text x="70" y="623" font-size="11.5" fill="#5B6C68">folder_id · question_key · status · sort_order</text>
  <text x="348" y="604" font-size="11" fill="#5B6C68" text-anchor="end">71행</text>

  <line x1="210" y1="572" x2="210" y2="584" stroke="#5B6C68" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="58" y="650" width="304" height="52" rx="9" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="70" y="669" font-size="12" font-weight="600" fill="#13201D" font-family="ui-monospace, Menlo, monospace">operating_hours · closure_dates</text>
  <text x="70" y="686" font-size="12" font-weight="600" fill="#13201D" font-family="ui-monospace, Menlo, monospace">settings</text>
  <text x="152" y="686" font-size="11.5" fill="#5B6C68">요일 7행 고정 · 휴무일 · 즉시중단</text>

  <!-- 상담 그룹 -->
  <rect x="404" y="478" width="380" height="238" rx="14" fill="#FFFFFF" stroke="#BCCBC6" stroke-width="1.5"/>
  <text x="422" y="506" font-size="13" font-weight="700" fill="#13201D">상담</text>

  <rect x="422" y="520" width="344" height="72" rx="9" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="434" y="540" font-size="12.5" font-weight="600" fill="#13201D" font-family="ui-monospace, Menlo, monospace">consultations</text>
  <text x="434" y="559" font-size="11.5" fill="#5B6C68">status · assigned_staff_id · context_qna_id</text>
  <text x="434" y="578" font-size="11.5" fill="#0B6E5A" font-weight="600">active_hospital_id — 병의원당 활성 1건 UNIQUE</text>
  <text x="752" y="540" font-size="11" fill="#5B6C68" text-anchor="end">9행</text>

  <rect x="422" y="604" width="344" height="52" rx="9" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="434" y="624" font-size="12.5" font-weight="600" fill="#13201D" font-family="ui-monospace, Menlo, monospace">consultation_messages</text>
  <text x="434" y="643" font-size="11.5" fill="#5B6C68">sequence · client_message_id · broadcast_pending</text>
  <text x="752" y="624" font-size="11" fill="#5B6C68" text-anchor="end">8행</text>

  <rect x="422" y="668" width="344" height="34" rx="9" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="434" y="689" font-size="12.5" font-weight="600" fill="#13201D" font-family="ui-monospace, Menlo, monospace">consultation_status_histories</text>
  <text x="752" y="689" font-size="11" fill="#5B6C68" text-anchor="end">26행</text>

  <line x1="594" y1="592" x2="594" y2="604" stroke="#5B6C68" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="594" y1="656" x2="594" y2="668" stroke="#5B6C68" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 기존 테이블 -->
  <rect x="808" y="478" width="332" height="238" rx="14" fill="#FFFFFF" stroke="#DBE4E1" stroke-dasharray="5 4"/>
  <text x="826" y="506" font-size="13" font-weight="700" fill="#5B6C68">기존 테이블 — 읽기만</text>
  <text x="826" y="530" font-size="12.5" fill="#5B6C68">FK로 참조만 하고 컬럼을 더하지 않았습니다.</text>

  <rect x="826" y="548" width="296" height="34" rx="9" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="838" y="569" font-size="12.5" fill="#13201D" font-family="ui-monospace, Menlo, monospace">hospitals</text>
  <rect x="826" y="592" width="296" height="34" rx="9" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="838" y="613" font-size="12.5" fill="#13201D" font-family="ui-monospace, Menlo, monospace">account_hospitals</text>
  <rect x="826" y="636" width="296" height="34" rx="9" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="838" y="657" font-size="12.5" fill="#13201D" font-family="ui-monospace, Menlo, monospace">account_staffs</text>
  <text x="826" y="694" font-size="11.5" fill="#0B6E5A">병의원명·요청자명·상담원명은 요청 시점 값을</text>
  <text x="826" y="710" font-size="11.5" fill="#0B6E5A">스냅샷으로 복사합니다. 계정을 지워도 기록이 남습니다.</text>

  <!-- ══════════ 3. 실시간 ══════════ -->
  <text x="40" y="778" font-size="17" font-weight="700" fill="#13201D">3. 실시간을 어떻게 했나 — 지금은 폴링입니다</text>

  <rect x="40" y="800" width="1100" height="118" rx="14" fill="#F6EADA" stroke="#9C5410" stroke-width="1.2"/>
  <text x="62" y="830" font-size="14" font-weight="700" fill="#9C5410">현재 동작: 폴링 (Polling)</text>
  <text x="62" y="856" font-size="13" fill="#13201D">화면이 주기적으로 다시 조회합니다. <tspan font-weight="600">메시지 5초 · 목록 10초 · 상담 상태 5초.</tspan></text>
  <text x="62" y="878" font-size="13" fill="#13201D">WebSocket 연결을 맺지 않으므로 상시 프로세스가 필요 없습니다.</text>
  <text x="62" y="902" font-size="12.5" fill="#9C5410">설정: <tspan font-family="ui-monospace, Menlo, monospace">BROADCAST_CONNECTION=log</tspan> — 이벤트를 만들되 밖으로 내보내지 않습니다.</text>

  <rect x="40" y="934" width="540" height="150" rx="14" fill="#FFFFFF" stroke="#DBE4E1"/>
  <text x="62" y="962" font-size="13.5" font-weight="700" fill="#13201D">Reverb(WebSocket) 코드는 이미 다 있습니다</text>
  <text x="62" y="986" font-size="12.5" fill="#5B6C68">· 채널 2개: 상담별 / 상담원 대기목록</text>
  <text x="62" y="1008" font-size="12.5" fill="#5B6C68">· 액터별 <tspan font-family="ui-monospace, Menlo, monospace" font-size="11.5">/broadcasting/auth</tspan> (기본값은 user 전용이라 따로 만듦)</text>
  <text x="62" y="1030" font-size="12.5" fill="#5B6C68">· 발행 실패 시 <tspan font-family="ui-monospace, Menlo, monospace" font-size="11.5">broadcast_pending</tspan> 표식 + 매분 재발행</text>
  <text x="62" y="1058" font-size="12.5" fill="#0B6E5A" font-weight="600">켜려면 환경변수 한 줄만 바꾸면 됩니다.</text>

  <rect x="600" y="934" width="540" height="150" rx="14" fill="#FFFFFF" stroke="#DBE4E1"/>
  <text x="622" y="962" font-size="13.5" font-weight="700" fill="#13201D">왜 폴링으로 두었나</text>
  <text x="622" y="986" font-size="12.5" fill="#5B6C68">Reverb는 상시 떠 있어야 하는 별도 프로세스입니다.</text>
  <text x="622" y="1008" font-size="12.5" fill="#5B6C68">배포 방식이 정해지지 않았고, 예상 규모(DAU 50 미만)에서</text>
  <text x="622" y="1030" font-size="12.5" fill="#5B6C68">5초 지연은 감당 가능하다고 판단했습니다.</text>
  <text x="622" y="1058" font-size="12.5" fill="#5B6C68">폴링은 원래 <tspan font-weight="600">발행 실패 대비 경로</tspan>라 새로 쓴 코드가 아닙니다.</text>

  <!-- ══════════ 4. 운영 요청 ══════════ -->
  <text x="40" y="1146" font-size="17" font-weight="700" fill="#13201D">4. 운영에 추가로 필요한 것</text>
  <text x="40" y="1170" font-size="13.5" fill="#5B6C68">기존 인프라(MySQL · Redis)를 그대로 씁니다. 아래 하나만 필수입니다.</text>

  <rect x="40" y="1192" width="356" height="172" rx="14" fill="#FFFFFF" stroke="#0B6E5A" stroke-width="1.8"/>
  <rect x="40" y="1192" width="356" height="30" rx="14" fill="#E0F0EA"/>
  <rect x="40" y="1210" width="356" height="12" fill="#E0F0EA"/>
  <text x="60" y="1213" font-size="12" font-weight="700" fill="#0B6E5A">필수</text>
  <text x="60" y="1252" font-size="14" font-weight="700" fill="#13201D">Scheduler (cron)</text>
  <text x="60" y="1278" font-size="12.5" fill="#5B6C68">두 가지를 돌립니다 (만료는 매분, 지표는 5분마다).</text>
  <text x="60" y="1300" font-size="12.5" fill="#13201D">· 대기 30분 넘은 상담 자동 취소</text>
  <text x="60" y="1322" font-size="12.5" fill="#13201D">· 지표 기록 (대기 수 · 최장 대기)</text>
  <rect x="60" y="1334" width="316" height="22" rx="5" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="70" y="1349" font-size="11" fill="#5B6C68" font-family="ui-monospace, Menlo, monospace">php artisan schedule:run</text>

  <rect x="420" y="1192" width="356" height="172" rx="14" fill="#FFFFFF" stroke="#DBE4E1" stroke-dasharray="5 4"/>
  <rect x="420" y="1192" width="356" height="30" rx="14" fill="#F7FAF9"/>
  <rect x="420" y="1210" width="356" height="12" fill="#F7FAF9"/>
  <text x="440" y="1213" font-size="12" font-weight="700" fill="#5B6C68">지금은 불필요</text>
  <text x="440" y="1252" font-size="14" font-weight="700" fill="#13201D">Queue Worker</text>
  <text x="440" y="1278" font-size="12.5" fill="#5B6C68">발행이 꺼져 있어 큐에 아무것도 들어가지</text>
  <text x="440" y="1300" font-size="12.5" fill="#5B6C68">않습니다. Reverb를 켜면 그때 필요합니다.</text>
  <rect x="440" y="1312" width="316" height="22" rx="5" fill="#F7FAF9" stroke="#DBE4E1"/>
  <text x="450" y="1327" font-size="11" fill="#5B6C68" font-family="ui-monospace, Menlo, monospace">queue: hospital-chatbot (redis)</text>

  <rect x="800" y="1192" width="340" height="172" rx="14" fill="#FFFFFF" stroke="#DBE4E1" stroke-dasharray="5 4"/>
  <rect x="800" y="1192" width="340" height="30" rx="14" fill="#F7FAF9"/>
  <rect x="800" y="1210" width="340" height="12" fill="#F7FAF9"/>
  <text x="820" y="1213" font-size="12" font-weight="700" fill="#5B6C68">선택</text>
  <text x="820" y="1252" font-size="14" font-weight="700" fill="#13201D">Reverb</text>
  <text x="820" y="1278" font-size="12.5" fill="#5B6C68">실시간을 즉시로 바꾸고 싶을 때만.</text>
  <text x="820" y="1300" font-size="12.5" fill="#5B6C68">상시 프로세스 + 포트가 필요합니다.</text>
  <text x="820" y="1326" font-size="12.5" fill="#9C5410">느리다는 얘기가 나오면 Reverb보다</text>
  <text x="820" y="1345" font-size="12.5" fill="#9C5410">폴링 주기를 줄이는 쪽을 먼저 보세요.</text>

  <!-- 각주 -->
  <line x1="40" y1="1400" x2="1140" y2="1400" stroke="#DBE4E1"/>
  <text x="40" y="1424" font-size="12" fill="#5B6C68">행 수는 로컬 개발 DB 기준입니다. Q&amp;A 71건은 예시 데이터이며 전용 Seeder로만 적재하고 전체 DatabaseSeeder에서는 돌지 않습니다.</text>
  <text x="40" y="1446" font-size="12" fill="#5B6C68">상세 계약(필드·오류코드·채널·이벤트)은 <tspan font-family="ui-monospace, Menlo, monospace" font-size="11.5">develop-doc/api.md</tspan> 의 「병의원 챗봇」 절에 있습니다.</text>
  <text x="40" y="1468" font-size="12" fill="#5B6C68">테스트 케이스와 배포 전 확인 목록은 <tspan font-family="ui-monospace, Menlo, monospace" font-size="11.5">develop-doc/hospital-chatbot-test-cases.md</tspan> 입니다.</text>
</svg>
